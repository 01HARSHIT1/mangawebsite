<svg width="400" height="600" viewBox="0 0 400 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="600" fill="url(#gradient)" />
  
  <!-- Gradient Definition -->
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#334155;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#475569;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Book Icon -->
  <g transform="translate(200,300)">
    <!-- Book Cover -->
    <rect x="-60" y="-80" width="120" height="160" rx="8" fill="url(#iconGradient)" opacity="0.8"/>
    
    <!-- Book Pages -->
    <rect x="-55" y="-75" width="110" height="150" rx="6" fill="#f8fafc" opacity="0.9"/>
    
    <!-- Book Spine -->
    <rect x="-60" y="-80" width="15" height="160" rx="8" fill="url(#iconGradient)"/>
    
    <!-- Page Lines -->
    <line x1="-40" y1="-50" x2="40" y2="-50" stroke="#cbd5e1" stroke-width="2" opacity="0.6"/>
    <line x1="-40" y1="-30" x2="40" y2="-30" stroke="#cbd5e1" stroke-width="2" opacity="0.6"/>
    <line x1="-40" y1="-10" x2="40" y2="-10" stroke="#cbd5e1" stroke-width="2" opacity="0.6"/>
    <line x1="-40" y1="10" x2="40" y2="10" stroke="#cbd5e1" stroke-width="2" opacity="0.6"/>
    <line x1="-40" y1="30" x2="40" y2="30" stroke="#cbd5e1" stroke-width="2" opacity="0.6"/>
    <line x1="-40" y1="50" x2="40" y2="50" stroke="#cbd5e1" stroke-width="2" opacity="0.6"/>
  </g>
  
  <!-- Title -->
  <text x="200" y="450" text-anchor="middle" fill="#94a3b8" font-family="Inter, sans-serif" font-size="18" font-weight="600">
    Manga Cover
  </text>
  
  <!-- Subtitle -->
  <text x="200" y="480" text-anchor="middle" fill="#64748b" font-family="Inter, sans-serif" font-size="14">
    Placeholder Image
  </text>
</svg>





